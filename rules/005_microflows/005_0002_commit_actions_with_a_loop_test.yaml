# Fixtures sit under ./ModuleA/ and ./ModuleB/, some in subfolders; those resolve via
# the app.yaml run-policy-tests.sh generates - run that script, not test-rules alone.
TestCases:
# --- allowed: structural / defensive ---
- name: allow microflow with no looped activity
  allow: true
  input:
    $Type: Microflows$Microflow
    Name: NoLoop
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$ActionActivity
          Action:
            $Type: Microflows$RetrieveAction

- name: allow looped activity with an empty body
  allow: true
  input:
    $Type: Microflows$Microflow
    Name: EmptyLoop
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects: []

- name: allow committing sub-microflow when the call sits outside any loop
  allow: true
  input:
    $Type: Microflows$Microflow
    Name: CommitOutsideLoop
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$ActionActivity
          Action:
            $Type: Microflows$MicroflowCallAction
            MicroflowCall:
              $Type: Microflows$MicroflowCall
              Microflow: ModuleA.CommitInLoop

# Reported rather than ignored: treating a failed lookup as "does not commit" is
# what let a broken resolver pass every microflow in a project.
- name: do not allow loop calling a microflow reference that does not resolve to a file
  allow: false
  input:
    $Type: Microflows$Microflow
    Name: LoopCallsMissing
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$MicroflowCallAction
                  MicroflowCall:
                    $Type: Microflows$MicroflowCall
                    Microflow: NonExistentModule.NonExistentFlow

- name: do not allow loop calling a microflow reference without a module prefix
  allow: false
  input:
    $Type: Microflows$Microflow
    Name: LoopCallsMalformed
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$MicroflowCallAction
                  MicroflowCall:
                    $Type: Microflows$MicroflowCall
                    Microflow: nodots

# --- allowed: direct action inside the loop that does NOT commit ---
- name: allow loop that directly contains a ChangeAction with Commit=No
  allow: true
  input:
    $Type: Microflows$Microflow
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$ChangeAction
                  Commit: "No"

- name: allow loop that directly contains a CreateChangeAction with Commit=No
  allow: true
  input:
    $Type: Microflows$Microflow
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$CreateChangeAction
                  Commit: "No"

# --- allowed: loop -> sub that does NOT commit ---
- name: allow loop calling sub-microflow that contains a ChangeAction with Commit=No
  allow: true
  input:
    $Type: Microflows$Microflow
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$MicroflowCallAction
                  MicroflowCall:
                    $Type: Microflows$MicroflowCall
                    Microflow: ModuleA.ChangeNoCommit

- name: allow loop calling sub-microflow that contains a CreateChangeAction with Commit=No
  allow: true
  input:
    $Type: Microflows$Microflow
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$MicroflowCallAction
                  MicroflowCall:
                    $Type: Microflows$MicroflowCall
                    Microflow: ModuleA.CreateNoCommit

- name: allow loop calling sub-microflow that transitively reaches a ChangeAction with Commit=No
  allow: true
  input:
    $Type: Microflows$Microflow
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$MicroflowCallAction
                  MicroflowCall:
                    $Type: Microflows$MicroflowCall
                    Microflow: ModuleA.CallsChangeNoCommit

- name: allow loop calling a self-recursive sub-microflow that never commits
  allow: true
  input:
    $Type: Microflows$Microflow
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$MicroflowCallAction
                  MicroflowCall:
                    $Type: Microflows$MicroflowCall
                    Microflow: ModuleA.RecursiveNoCommit

# --- disallowed: direct commit-capable action inside the loop ---
- name: do not allow loop that directly contains a CommitAction
  allow: false
  input:
    $Type: Microflows$Microflow
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$CommitAction

- name: do not allow loop that directly contains a ChangeAction with Commit=Yes
  allow: false
  input:
    $Type: Microflows$Microflow
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$ChangeAction
                  Commit: "Yes"

- name: do not allow loop that directly contains a CreateChangeAction with Commit=Yes
  allow: false
  input:
    $Type: Microflows$Microflow
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$CreateChangeAction
                  Commit: "Yes"

# --- disallowed: loop -> sub with a commit-capable action ---

# In ModuleA/SomeFolder/, so this fails against a resolver that maps a name
# straight onto Module/Name.yaml.
- name: do not allow loop calling sub-microflow in a subfolder that contains a CommitAction
  allow: false
  input:
    $Type: Microflows$Microflow
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$MicroflowCallAction
                  MicroflowCall:
                    $Type: Microflows$MicroflowCall
                    Microflow: ModuleA.CommitInLoop

- name: do not allow loop calling sub-microflow that contains a ChangeAction with Commit=Yes
  allow: false
  input:
    $Type: Microflows$Microflow
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$MicroflowCallAction
                  MicroflowCall:
                    $Type: Microflows$MicroflowCall
                    Microflow: ModuleA.ChangeWithCommit

- name: do not allow loop calling sub-microflow that contains a CreateChangeAction with Commit=Yes
  allow: false
  input:
    $Type: Microflows$Microflow
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$MicroflowCallAction
                  MicroflowCall:
                    $Type: Microflows$MicroflowCall
                    Microflow: ModuleA.CreateWithCommit

# --- disallowed: loop -> SUB -> sub with a commit-capable action ---
- name: do not allow loop calling sub-microflow that transitively reaches a CommitAction
  allow: false
  input:
    $Type: Microflows$Microflow
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$MicroflowCallAction
                  MicroflowCall:
                    $Type: Microflows$MicroflowCall
                    Microflow: ModuleA.CallsCommit

- name: do not allow loop calling sub-microflow that transitively reaches a ChangeAction with Commit=Yes
  allow: false
  input:
    $Type: Microflows$Microflow
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$MicroflowCallAction
                  MicroflowCall:
                    $Type: Microflows$MicroflowCall
                    Microflow: ModuleA.CallsChangeWithCommit

- name: do not allow loop calling sub-microflow that transitively reaches a CreateChangeAction with Commit=Yes
  allow: false
  input:
    $Type: Microflows$Microflow
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$MicroflowCallAction
                  MicroflowCall:
                    $Type: Microflows$MicroflowCall
                    Microflow: ModuleA.CallsCreateWithCommit

- name: do not allow loop calling a self-recursive sub-microflow that also contains a CommitAction
  allow: false
  input:
    $Type: Microflows$Microflow
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$MicroflowCallAction
                  MicroflowCall:
                    $Type: Microflows$MicroflowCall
                    Microflow: ModuleA.RecursiveCommit

# --- document resolution: same name in two modules, and file/Name mismatch ---
- name: do not allow loop calling a sub-microflow whose name is also used by another module that does not commit
  allow: false
  input:
    $Type: Microflows$Microflow
    Name: LoopCallsSharedNameCommitting
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$MicroflowCallAction
                  MicroflowCall:
                    $Type: Microflows$MicroflowCall
                    Microflow: ModuleA.SharedName

- name: allow loop calling a sub-microflow whose name is also used by another module that does commit
  allow: true
  input:
    $Type: Microflows$Microflow
    Name: LoopCallsSharedNameClean
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$MicroflowCallAction
                  MicroflowCall:
                    $Type: Microflows$MicroflowCall
                    Microflow: ModuleB.SharedName

# That file holds a document named NotMismatch, so it is not ModuleA.Mismatch.
- name: do not allow loop calling a microflow whose file holds a differently named document
  allow: false
  input:
    $Type: Microflows$Microflow
    Name: LoopCallsMismatch
    ObjectCollection:
      $Type: Microflows$MicroflowObjectCollection
      Objects:
        - $Type: Microflows$LoopedActivity
          ObjectCollection:
            $Type: Microflows$MicroflowObjectCollection
            Objects:
              - $Type: Microflows$ActionActivity
                Action:
                  $Type: Microflows$MicroflowCallAction
                  MicroflowCall:
                    $Type: Microflows$MicroflowCall
                    Microflow: ModuleA.Mismatch
