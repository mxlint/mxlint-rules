TestCases:
  - name: allow microflow with a normal annotation
    allow: true
    input:
      $Type: Microflows$Microflow
      Name: MyFlow
      ObjectCollection:
        $Type: Microflows$MicroflowObjectCollection
        Objects:
          - $Type: Microflows$Annotation
            Caption: "This flow processes orders."
  - name: allow microflow without annotations
    allow: true
    input:
      $Type: Microflows$Microflow
      Name: MyFlow
      ObjectCollection:
        $Type: Microflows$MicroflowObjectCollection
        Objects:
          - $Type: Microflows$ActionActivity
  - name: do not allow TODO annotation
    allow: false
    input:
      $Type: Microflows$Microflow
      Name: MyFlow
      ObjectCollection:
        $Type: Microflows$MicroflowObjectCollection
        Objects:
          - $Type: Microflows$Annotation
            Caption: "TODO: handle the error case"
  - name: do not allow lowercase fixme annotation
    allow: false
    input:
      $Type: Microflows$Microflow
      Name: MyFlow
      ObjectCollection:
        $Type: Microflows$MicroflowObjectCollection
        Objects:
          - $Type: Microflows$Annotation
            Caption: "fixme before release"
